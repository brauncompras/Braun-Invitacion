<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiesta de fin de año · Braun Instalaciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;600&display=swap">
<style>
:root{--b1:#061a40;--b2:#0b3d91;--b3:#1f6fe0;--b4:#8cc0ff;--ice:#eef5ff;--gold:#ffd57a;--card:#f4f8ff;--ink:#0a2457;--muted:#35507f;--h1:#0b3d91;--h2:#1f6fe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#030f2b;--card:#0e2552;--ink:#eaf3ff;--muted:#a9c4f2;--h1:#8cc0ff;--h2:#eaf3ff}}
:root[data-theme="dark"]{--b1:#030f2b;--card:#0e2552;--ink:#eaf3ff;--muted:#a9c4f2;--h1:#8cc0ff;--h2:#eaf3ff}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0,var(--b2),var(--b1) 70%),var(--b1);color:var(--ice);font-family:Poppins,system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
.fl,.st,.bk,.hill,.tree,.ball,.wire,.cf{position:fixed;pointer-events:none}
.fl{top:-10px;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0)}}
.st{width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.bk{border-radius:50%;filter:blur(32px);background:var(--b3);opacity:.35;animation:fl 12s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(30px,-40px) scale(1.25)}}
.wire{left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;background:#0d2a66;z-index:3}
.bu{position:absolute;top:0;width:12px;height:18px;margin-left:-6px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 14px 3px var(--c);animation:bl 1.8s ease-in-out infinite}
.bu::before{content:"";position:absolute;left:4px;top:-5px;width:4px;height:6px;background:#0d2a66}
@keyframes bl{50%{opacity:.35;box-shadow:0 0 4px 1px var(--c)}}
.ball{top:calc(env(safe-area-inset-top,0px) + var(--L,80px));box-shadow:0 8px 20px #0006,inset -6px -8px 14px #0b3d9199;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fffa,#fff0 28%),radial-gradient(circle at 40% 35%,var(--b4),var(--b3) 55%,var(--b1));transform-origin:50% calc(-1*var(--L,80px));animation:sw 4s ease-in-out infinite alternate;z-index:2}
.ball::before{content:"";position:absolute;left:50%;top:calc(-1*var(--L,80px));width:1px;height:var(--L,80px);background:#9bbcf0}
.med{position:absolute;inset:17%;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px #ffd57acc,inset 0 0 8px #0b3d9133;font:800 calc(var(--s)*.4) "Playfair Display",serif;color:var(--b2)}
.med img{width:72%;height:72%;object-fit:contain}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.hill{height:150px;border-radius:50%;background:linear-gradient(#f2f8ff,#cfe2ff)}
.tree{bottom:44px}.tree svg{width:100%;height:100%;display:block;overflow:visible}.sr{fill:var(--gold);animation:tr 1.6s infinite}.lg{animation:tr 1.4s ease-in-out infinite}@keyframes tr{50%{opacity:.3}}
.scene{position:relative;z-index:10;display:grid;place-items:center;height:100%}
.scene>*{grid-area:1/1}
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/2;perspective:900px;cursor:pointer;transition:transform .9s,opacity .9s;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px}}
.env.away{transform:translateY(140px) scale(.8);opacity:0;pointer-events:none;animation:none}
.env div{position:absolute}
.bk0{inset:0;border-radius:10px;background:var(--b3);box-shadow:0 20px 50px #0008,0 0 60px #1f6fe055}
.lt{left:7%;right:7%;top:8%;bottom:6%;background:var(--ice);border-radius:6px;z-index:1;transition:transform .9s cubic-bezier(.3,1.3,.5,1);display:grid;place-items:center;color:var(--b2);font:800 .95rem "Playfair Display",serif}
.out .lt{transform:translateY(-62%)}
.pk{inset:0;z-index:3;background:linear-gradient(160deg,#2f86ff,#0f4bb8);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.fp{left:0;right:0;top:0;height:58%;z-index:2;background:linear-gradient(#1a63d6,#0d44a8);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index 0s .4s}
.open .fp{transform:rotateX(180deg);z-index:0}
.sl{left:50%;top:58%;width:15%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#ffe9b0,var(--gold) 55%,#c98f1f);display:grid!important;place-items:center;font:800 1.2rem "Playfair Display",serif;color:#7a4c00;box-shadow:0 4px 10px #0006;transition:.4s;animation:pl 1.6s infinite}
@keyframes pl{50%{scale:1.12}}
.open .sl{opacity:0;scale:0;animation:none}
.hint{left:0;right:0;bottom:-46px;text-align:center;font-size:.9rem;letter-spacing:.06em;animation:fd 1.6s infinite}
@keyframes fd{50%{opacity:.4}}
.card{position:relative;width:min(92vw,420px);max-height:84vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:22px;padding:26px 22px 20px;box-shadow:0 30px 80px #000a,0 0 0 1px #8cc0ff55;display:none;text-align:center;box-sizing:border-box}
.card.show{display:block;animation:pop .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(90px) scale(.6) rotate(-3deg)}}
.card.bye{animation:bye .45s forwards}@keyframes bye{to{opacity:0;transform:translateY(90px) scale(.6) rotate(-3deg)}}
.brand{font:800 1.5rem "Playfair Display",serif;letter-spacing:.25em;color:var(--h2)}
.brand small{display:block;font:600 .62rem Poppins,sans-serif;letter-spacing:.4em;color:var(--muted)}
h2{font:800 1.55rem/1.2 "Playfair Display",serif;margin:14px 0 8px;background:linear-gradient(90deg,var(--h1),var(--h2),var(--h1));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:300%}}
h2.rd{--h1:#c1121f;--h2:#ff3b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2.rd{--h1:#ff4d4d;--h2:#ff9a9a}}
:root[data-theme="dark"] h2.rd{--h1:#ff4d4d;--h2:#ff9a9a}
.pane{display:none}.pane.on{display:block;animation:fi .6s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}}
.tx{min-height:5.2em;font-size:.98rem;line-height:1.6;color:var(--muted)}
.tx.ty::after{content:"▌";animation:fd .8s infinite;color:var(--h2)}
.tl,.fm{visibility:hidden}.tl.in,.fm.in{visibility:visible}
.tl{display:grid;gap:10px;margin:10px 0 4px}
.t{display:flex;gap:12px;align-items:center;text-align:left;background:linear-gradient(120deg,var(--b2),var(--b3));color:#fff;border-radius:14px;padding:12px 14px}
.tl.in .t{animation:sl .6s both}.t:nth-child(2){animation-delay:.25s!important}.t:nth-child(3){animation-delay:.5s!important}
@keyframes sl{from{opacity:0;transform:translateX(-30px)}}
a.t{text-decoration:none;color:#fff}.t .mp{text-transform:none;letter-spacing:0;margin-top:3px;text-decoration:underline;opacity:.95}
.t>span{font-size:1.6rem}.t small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.fm.in{animation:fi .6s}
input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:2px solid var(--b4);background:transparent;color:var(--ink);font:inherit;font-size:16px;margin:6px 0 12px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font:600 .95rem Poppins,sans-serif;background:linear-gradient(120deg,var(--b2),var(--b3));color:#fff;cursor:pointer;box-shadow:0 6px 18px #1f6fe055;transition:.2s}
.btn:active{scale:.96}.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--b3)}
.ms{min-height:1.4em;font-size:.95rem;font-weight:600;margin:12px 0 0;color:var(--h2)}
.nx{margin-top:14px}.sw{display:block;margin-top:8px;font-size:.7rem;color:var(--muted)}.card{touch-action:pan-y}a.btn{display:inline-block;text-decoration:none;margin-top:10px}
.dots{margin-top:16px}.dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:6px;background:var(--muted);opacity:.35;transition:.3s}.dots .on{opacity:1;background:var(--b3);width:22px}
.cf{top:-14px;width:8px;height:14px;z-index:20;animation:cf 3s ease-in forwards}
@keyframes cf{to{transform:translate3d(var(--x),105vh,0) rotate(720deg)}}
.ls{margin-top:14px;font-size:.85rem;color:var(--muted)}.ch{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;max-height:110px;overflow:auto}.ch span{background:linear-gradient(120deg,var(--b2),var(--b3));color:#fff;border-radius:999px;padding:4px 10px;animation:pp .4s both}@keyframes pp{from{opacity:0;transform:scale(.5)}}
.mu{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:1.3rem;backdrop-filter:blur(6px);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.fl,.bk,.cf{display:none}}

let ac,on=false,ni=0,mus=0,tm;
function tone(f,d){for(const h of [1,2]){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=h>1?"sine":"triangle";o.frequency.value=f*h;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(h>1?.04:.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d*.9+.4);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d*.9+.5)}}
function step(){if(!on)return;const[f,b]=N[ni++%N.length];if(f)tone(f,b*.45);tm=setTimeout(step,b*450)}
function tog(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();clearTimeout(tm);on=!on;if(on){ac.resume();step()}$("#mu").textContent=on?"🔊":"🔇"}
$("#mu").onclick=tog;
</script></body></html>
