{t:"Tu esfuerzo y compromiso hicieron posible este gran año, y queremos celebrarlo contigo.",x(){}},

{t:"¿Nos acompañas? Confirma tu asistencia para que no falte nada para ti.",x(){$("#fm").classList.add("in")}}];
let k=-1,mx=-1;
function go(){if(ty){ty();return}if(k<S.length-1)show(k+1)}

const e=$("#env"),c=$("#card");

let sx=null,sw=0;const cd=$("#card");

async function rsvp(si){

const ok=si?`¡Qué gusto, ${nm}! Te esperamos en la fiesta 🎉`:`Gracias por avisar, ${nm}. ¡Te vamos a extrañar!`;
